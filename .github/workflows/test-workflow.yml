name: Test

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-diff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: git diff --check
  test-npm:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Retain synthetic browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
  test-go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: test-go (${{ matrix.os }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - if: contains(matrix.os, 'ubuntu')
        working-directory: src
        run: |
          go version | grep -F 'go1.26.10 '
          go test ./... -short -count=1 -coverprofile=coverage.out
          go test ./factorio ./api -race -short -run 'Test(ModPackMerge|MergeModPack|ModPortalPreferences|ModPortalOptionalDefaults)' -count=1
          go test ./lockfile ./api/websocket -race -short -count=1
          go test . ./factorio -race -short -run 'Test(Shutdown|StopAlreadyStopped|FailedStartup|InvalidStartupSettings|ParallelStart|ConcurrentStartClaims|ParallelStartKeepsWinningRequestSnapshotAndRejectsSecondClaim)' -count=1
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - if: contains(matrix.os, 'windows')
        working-directory: src
        run: |
          go version | findstr /C:"go1.26.10 "
          go test ./... -short -count=1
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: SonarQube analysis
        if: >-
          contains(matrix.os, 'ubuntu') && (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' &&
             (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')) ||
            (github.event_name == 'push' && github.ref == 'refs/heads/development') ||
            (github.event_name == 'pull_request' &&
             github.base_ref == 'development' &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             github.event.pull_request.user.type != 'Bot' &&
             github.actor != 'dependabot[bot]'))
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  test-unraid-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Community Applications metadata
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/validate-unraid-template.py
  docker-build:
    needs: [test-npm, test-go, test-unraid-template, test-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test replacement operations on mounted Factorio directories
        run: |
          docker run --rm \
            --mount type=bind,source="$PWD/src",target=/workspace,readonly \
            --mount type=tmpfs,destination=/opt/factorio \
            --mount type=tmpfs,destination=/opt/factorio/mods \
            --mount type=tmpfs,destination=/opt/factorio/config \
            --mount type=tmpfs,destination=/opt/fsm-test-managed \
            --mount type=tmpfs,destination=/opt/fsm-test-managed/servers/2/config \
            --env FSM_TEST_MOUNTED_FACTORIO_DIR=/opt/factorio \
            --env FSM_TEST_MOUNTED_MODS_DIR=/opt/factorio/mods \
            --env FSM_TEST_MOUNTED_CONFIG_DIR=/opt/factorio/config \
            --env FSM_TEST_MOUNTED_MANAGER_DIR=/opt/fsm-test-managed \
            --workdir /workspace \
            golang:1.26.10-bookworm@sha256:632dff7351799a5a9954a48dc06670ade72ee44e8c351cdc0e5a57af2fea21af \
            go test ./factorio -run '^(TestDeleteAllModsAtMountedDestination|TestReplaceModsFromSaveAtMountedDestination|TestReplaceReleaseFilesAtMountedDestination|TestModStartupSettingsAtomicWriteAtMountedDestination|TestRestoreModBackupAtMountedDestination|TestMergeModPackAtMountedDestination|TestPresetAssignmentAtMountedDestination|TestManagedRuntimeConfigAtMountedDestination)$' -count=1 -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build production container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.registry
          platforms: linux/amd64
          push: false
          load: true
          tags: factorio-server-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Reject missing persistent mounts
        shell: bash
        run: |
          set +e
          output=$(docker run --rm factorio-server-manager:ci 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          grep -F '/opt/fsm-data is not a persistent bind mount or named volume' <<<"$output"
          test "$(docker image inspect factorio-server-manager:ci --format '{{json .Config.Volumes}}')" = "null"
          ! grep -F 'Target="/opt/factorio"' templates/factorio-server-manager.xml
      - name: Accept split Unraid game-data mounts
        run: |
          runtime_uid=$(docker run --rm --entrypoint id factorio-server-manager:ci -u)
          runtime_gid=$(docker run --rm --entrypoint id factorio-server-manager:ci -g)
          docker run --rm \
            --tmpfs /opt/fsm-data:uid="$runtime_uid",gid="$runtime_gid",mode=0700 \
            --tmpfs /opt/factorio/saves:uid="$runtime_uid",gid="$runtime_gid",mode=0700 \
            --tmpfs /opt/factorio/mods:uid="$runtime_uid",gid="$runtime_gid",mode=0700 \
            --tmpfs /opt/factorio/config:uid="$runtime_uid",gid="$runtime_gid",mode=0700 \
            factorio-server-manager:ci true
      - name: Real-engine lifecycle with combined persistent storage
        run: python3 scripts/test-container-lifecycle.py --disposable --version 2.0.77 --mode factorio --layout combined
      - name: Real-engine lifecycle with split Unraid storage and Space Age
        run: python3 scripts/test-container-lifecycle.py --disposable --version 2.1.20 --mode space-age --layout split
